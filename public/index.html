<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indodax Dry Run Bot</title><style>body{font:16px system-ui;background:#f6f8fb;color:#172033;margin:0;padding:24px}.box{max-width:700px;margin:30px auto;background:white;border:1px solid #e3e8f0;border-radius:12px;padding:22px}code{background:#eef2f7;padding:3px 6px;border-radius:4px}a{color:#165dba}</style></head><body><main class="box"><h1>Indodax Crypto Dry Run Bot</h1><p>Mode simulasi saja. Bot hanya membaca API publik Indodax dan tidak mengirim order sungguhan.</p><p>Status: <strong id="status">memuat…</strong></p><pre id="details">—</pre><p><a href="/dashboard-offline.html">Dashboard offline (setelah dibangun)</a></p></main><script>fetch('/api/status').then(r=>r.json()).then(d=>{document.getElementById('status').textContent=d.killSwitch?'KILL SWITCH AKTIF':'READY / '+d.mode;document.getElementById('details').textContent=JSON.stringify(d,null,2)}).catch(e=>{document.getElementById('status').textContent='API belum terhubung';document.getElementById('details').textContent=String(e)})</script></body></html>
