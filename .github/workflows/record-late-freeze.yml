      - name: Download preparation artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.prep.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p preparation-artifact
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name indodax-market-preparation \
            --dir preparation-artifact
          test -f preparation-artifact/config/universe.json
          test -f preparation-artifact/data/snapshots.jsonl
          test -f preparation-artifact/results/backtest.json
          cp -a preparation-artifact/. .
          rm -rf preparation-artifact
